name: PR Validation

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

env:
  WARN_SIZE: 1M
  FAIL_SIZE: 10M

jobs:
  validate-pr:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check file sizes
        run: |
          echo "Checking for files larger than ${WARN_SIZE} (warning only)"

          # List files > WARN_SIZE (excluding .git)
          find . -path ./.git -prune -o -type f -size +${WARN_SIZE} -print0 \
            | xargs -0 -r ls -lh \
            | awk '{print "WARN:", $9, "(", $5, ")"}' || true

          echo ""
          echo "Failing PR if files larger than ${FAIL_SIZE} are found"

          # Find files > FAIL_SIZE (excluding .git)
          LARGE_FILES=$(find . -path ./.git -prune -o -type f -size +${FAIL_SIZE} -print)

          if [ -n "$LARGE_FILES" ]; then
            echo "ERROR: Files larger than ${FAIL_SIZE} detected:"
            echo "$LARGE_FILES"
            exit 1
          fi

          echo "File size check passed ✔"

  labeler:
    name: Label PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/labeler@v6
